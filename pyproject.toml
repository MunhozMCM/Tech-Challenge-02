[project]
name = "techchallenge2"
version = "0.1.0"
description = "Tech Challenge Fase 2 — sistema preditivo de propensão de compra (ML Engineering)"
readme = "README.md"
authors = [
    { email = "lucasmunhozz23@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dvc>=3.67.1",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "statsmodels>=0.14.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
